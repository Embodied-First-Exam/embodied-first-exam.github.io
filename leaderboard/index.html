<body data-page="leaderboard">
<div id="nav"></div>
<main>

  <header class="page-head">
    <p class="kicker">Leaderboard</p>
    <h1>Leaderboard</h1>
    <p class="lead">The same questions, open book and closed book. Click a model to see it suite by suite.</p>
  </header>

  <section class="section tight">
    <p class="lb-pre"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.2"/></svg>
      <span id="lb-pre-text"></span> <a href="#counting">How it is counted ↓</a></p>
    <div class="lb-bar">
      <div class="seg" id="lb-view" role="group" aria-label="Which questions">
        <button class="on" data-view="shared">Head to head</button>
        <button data-view="all">Everything each sat</button>
      </div>
      <div class="seg" id="lb-mode" role="group" aria-label="Sort by">
        <button class="on" data-mode="privileged"><span class="dot p"></span>Open book</button>
        <button data-mode="standard"><span class="dot s"></span>Closed book</button>
      </div>
      <div class="chips" id="lb-harness" role="group" aria-label="Harness"></div>
      <span class="grow"></span>
      <div class="seg" id="lb-kind" role="group" aria-label="Kind of entrant">
        <button class="on" data-kind="agent">Code agents</button>
        <button data-kind="vla">VLA policies <i id="n-vla"></i></button>
      </div>
    </div>
    <div class="dumbbell full" id="lb-board"></div>
    <p class="note" id="lb-note"></p>
  </section>

  <section class="section">
    <div class="head reveal">
      <h2>Suite by suite</h2>
      <p>Each pair of dots is one model on one suite. A full circle is 100%.</p>
    </div>
    <div class="sdots reveal" id="lb-suites"></div>
  </section>

  <section class="section" id="counting">
    <div class="head reveal">
      <h2>How it is counted</h2>
    </div>
    <div class="rules6 reveal" id="lb-rules"></div>
    <p class="note reveal"><a href="../how/">How a question is marked →</a></p>
  </section>

</main>
<div id="footer"></div>
</body>
</html>
